name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir dist
          go build -trimpath -ldflags="-H windowsgui -s -w" -o dist/bwpageant.exe .
          (cd dist && sha256sum bwpageant.exe > bwpageant.exe.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: bwpageant
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bwpageant
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
